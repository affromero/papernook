---
# Setup: pre-commit install --install-hooks
#   (installs BOTH the pre-commit and pre-push hooks; see
#   default_install_hook_types below.)
#
# Two tiers, mirroring CI (.github/workflows/ci.yml). Every hook sets
# `stages` explicitly:
#   pre-commit (fast, every commit): hygiene + file/dir limits +
#     lint-staged (eslint + prettier + sort-package-json) + tsc.
#   pre-push (the full gate, every push): vitest + next build.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: mixed-line-ending
        args: [--fix, lf]
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
        exclude: ^tsconfig.*\.json$
      - id: check-added-large-files
        args: [--maxkb=2000]
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      - id: check-symlinks
        stages: [pre-commit]
      - id: destroyed-symlinks
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]

  - repo: local
    hooks:
      # --- pre-commit: fast checks on every commit ---
      - id: file-line-count
        name: file line count (< 1000)
        entry: scripts/hooks/check_file_line_count.sh
        language: system
        stages: [pre-commit]
        files: ^(src|tests|scripts)/.*\.(ts|tsx|js|jsx|mjs|cjs|css|sh)$

      - id: dir-file-count
        name: directory file count (new files <= 10)
        entry: scripts/hooks/check_dir_file_count.sh
        language: system
        stages: [pre-commit]
        files: ^(src|tests|scripts)/.*\.(ts|tsx|js|jsx|mjs|cjs|sh)$

      - id: no-secret-files
        name: no local env or key files
        entry: scripts/hooks/check_no_secret_files.sh
        language: system
        stages: [pre-commit]
        files: (^|/)(\.env($|\.)|.*\.(pem|key)$|.*id_rsa.*|.*id_ed25519.*)

      - id: shebang-scripts-executable
        name: shebang scripts are executable
        entry: scripts/hooks/check_shebang_executable.sh
        language: system
        stages: [pre-commit]
        files: ^(src|tests|scripts)/.*\.(ts|tsx|js|jsx|mjs|cjs|sh)$

      - id: lint-staged
        name: lint-staged (eslint + prettier + sort-package-json)
        entry: npx lint-staged --allow-empty
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false

      - id: typecheck
        name: typecheck (tsc --noEmit)
        entry: npm run typecheck
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false

      # --- pre-push: the full CI-equivalent gate, run once per push ---
      - id: test
        name: vitest
        entry: npm run test
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      - id: build
        name: next build
        entry: npm run build
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
