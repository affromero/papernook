<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>papernook extension</title>
    <style>
      body {
        font-family: -apple-system, system-ui, sans-serif;
        max-width: 26rem;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      label {
        display: block;
        margin-top: 1rem;
        font-weight: 600;
      }
      input[type="url"] {
        width: 100%;
        padding: 0.45rem 0.6rem;
        margin-top: 0.3rem;
        box-sizing: border-box;
      }
      .toggle {
        font-weight: 400;
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      button {
        margin-top: 1.25rem;
        padding: 0.45rem 1.1rem;
      }
      #status {
        margin-left: 0.6rem;
        color: #2e7d32;
      }
    </style>
  </head>
  <body>
    <h1>papernook</h1>
    <label for="base-url">
      Server URL
      <input
        id="base-url"
        type="url"
        placeholder="https://papernook.example.com"
      />
    </label>
    <label class="toggle">
      <input id="auto-intercept" type="checkbox" checked />
      Open PDFs in papernook automatically
    </label>
    <p>
      Automatic opening only acts on research sites: arXiv, OpenReview, bioRxiv,
      medRxiv, ACL Anthology, NeurIPS, PMLR, and CVF. Everywhere else — and with
      automatic opening off — use the toolbar button, which needs no site access
      until you click it.
    </p>
    <label for="extra-host">
      Also open PDFs automatically on
      <input id="extra-host" type="text" placeholder="journals.example.org" />
    </label>
    <button id="add-host" type="button">Add site</button>
    <ul id="extra-hosts"></ul>
    <button id="save" type="button">Save</button
    ><span id="status" role="status" aria-live="polite"></span>
    <script src="options.js"></script>
  </body>
</html>
