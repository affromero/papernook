name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: node scripts/assert-standalone-safe.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  container:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build --tag papernook:ci .
      - name: Smoke-test hardened runtime
        run: |
          docker run --detach --name papernook-ci \
            --publish 127.0.0.1:3000:3000 \
            --env AI_PROVIDER=openai \
            --env OPENAI_API_KEY=test-only \
            --env PUBLIC_EXPOSURE=true \
            --env PAPERNOOK_PUBLIC_HOST=127.0.0.1 \
            --env PAPERNOOK_PASSWORD=ci-access-password-unique \
            --env SESSION_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            papernook:ci
          trap 'docker rm --force papernook-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs papernook-ci
              exit 1
            fi
            sleep 1
          done
          test "$(docker exec papernook-ci awk '/^Uid:/{print $2}' /proc/1/status)" = "1000"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/settings)" = "307"
          test -z "$(docker exec papernook-ci sh -c \
            'find /app -maxdepth 3 \( -name ".env*" -o -name src -o -name tests -o -name docs -o -name AGENTS.md -o -name CLAUDE.md \) -print')"
