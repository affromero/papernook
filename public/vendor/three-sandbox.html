<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Papernook 3D sandbox</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #101014;
      }
      canvas {
        display: block;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./three/three.module.min.js",
          "three/addons/": "./three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <script>
      // Host page for AI-emitted ```threejs blocks. Always framed with
      // sandbox="allow-scripts" (opaque origin — no cookies, no DOM
      // access to the app); scene code arrives percent-encoded in the
      // URL fragment (see ThreeSandbox.tsx). Served from /vendor/ so the
      // app's nonce CSP and auth proxy don't apply.
      const code = decodeURIComponent(location.hash.slice(1));
      const script = document.createElement("script");
      script.type = "module";
      script.textContent = code;
      document.body.appendChild(script);
    </script>
  </body>
</html>
